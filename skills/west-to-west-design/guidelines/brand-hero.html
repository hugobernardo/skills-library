<!-- @dsCard group="Brand" viewport="700x230" name="Hero treatment" subtitle="Photo under ink→ocean scrim + faint 64px grid; green italic em; ring motif at 7%" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.hero{position:relative;height:230px;display:flex;align-items:center;overflow:hidden;background:var(--ink)}.bg{position:absolute;inset:0;background:var(--hero-scrim),url('../assets/hero-golden-gate.jpg') center/cover no-repeat}.bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:64px 64px}.rings{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:260px;height:260px;opacity:0.07}.rings div{position:absolute;border-radius:50%;border:1.5px solid var(--flag-green)}h1{position:relative;z-index:2;color:var(--white);font-family:var(--font-display);font-size:34px;line-height:42px;font-weight:700;margin:0 0 0 36px;max-width:480px}h1 em{color:var(--flag-green)}</style></head><body>
<div class="hero"><div class="bg"></div>
<div class="rings"><div style="inset:0"></div><div style="inset:12.5%"></div><div style="inset:25%"></div></div>
<h1>Bridging Portugal and <em>Silicon Valley</em></h1></div>
</body></html>
