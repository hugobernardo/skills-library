<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & feedback" subtitle="Slate neutrals plus success/error states" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0}.row{display:flex;height:150px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:var(--font-body);font-size:12px}.sw b{font-weight:600;display:block}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--slate-900);color:#fff"><b>Slate 900</b>#0F172A</div>
<div class="sw" style="background:var(--slate-600);color:#fff"><b>Slate 600</b>#475569</div>
<div class="sw" style="background:var(--slate-200);color:var(--slate-600)"><b>Slate 200</b>#E2E8F0</div>
<div class="sw" style="background:var(--success-bg);color:var(--ink)"><b>Success</b>green bg / ink text</div>
<div class="sw" style="background:var(--error-bg);color:var(--error-fg);border:1px solid var(--error-border)"><b>Error</b>#FEE2E2 / #991B1B</div>
</div></body></html>
