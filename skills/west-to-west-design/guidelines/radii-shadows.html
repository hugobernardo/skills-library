<!-- @dsCard group="Spacing" viewport="700x190" name="Radii & shadows" subtitle="6/12/20px radii · three ink-tinted shadows · cards are border-first" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--cloud);padding:24px 28px;font-family:var(--font-body);display:flex;gap:20px;align-items:center}.box{background:var(--white);width:100px;height:80px;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:var(--slate-600)}</style></head><body>
<div class="box" style="border-radius:var(--radius-sm);border:1px solid var(--slate-200)">6px sm<br>buttons</div>
<div class="box" style="border-radius:var(--radius-md);border:1px solid var(--slate-200)">12px md<br>cards</div>
<div class="box" style="border-radius:var(--radius-lg);border:1px solid var(--slate-200)">20px lg<br>rare</div>
<div class="box" style="box-shadow:var(--shadow-sm);border-radius:var(--radius-md)">shadow-sm</div>
<div class="box" style="box-shadow:var(--shadow-md);border-radius:var(--radius-md)">shadow-md</div>
<div class="box" style="box-shadow:var(--shadow-lg);border-radius:var(--radius-md)">shadow-lg<br>hover lift</div>
</body></html>
